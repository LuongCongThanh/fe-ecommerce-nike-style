# Standalone Next.js app at the repo root (slice 0 of the three-repo restructure).
# pnpm project settings for the single root package.

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  esbuild: false
  msw: false
  unrs-resolver: false

overrides:
  fast-uri: '>=3.1.9'
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  # Keep each consumer on a compatible export API (v3 is callable; v9 uses named exports).
  minimatch@>=3 <4: '^3.1.5'
  minimatch@>=9 <10: '^9.0.9'
  nanoid: '>=3.3.17'
  postcss: '>=8.5.23'
  serialize-javascript: '>=7.0.5'
  sharp: '>=0.35.0'
  vite: '>=8.2.4'
  zod: '>=4.6.6'
