# Standalone Next.js app at the repo root (slice 0 of the three-repo restructure).
# The legacy apps/admin, apps/cms and packages/* stay on disk until the cleanup slice but are
# deliberately NOT workspace members: `pnpm install` / `pnpm build` only see the root app.
packages: []

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  msw: false
  unrs-resolver: false

overrides:
  nanoid: '>=3.3.17'
  postcss: '>=8.5.23'
  serialize-javascript: '>=7.0.5'
  sharp: '>=0.35.0'
