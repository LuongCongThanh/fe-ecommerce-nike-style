# Standalone Next.js app at the repo root (slice 0 of the three-repo restructure).
# pnpm project settings for the single root package.

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  msw: false
  unrs-resolver: false

overrides:
  nanoid: '>=3.3.17'
  postcss: '>=8.5.23'
  serialize-javascript: '>=7.0.5'
  sharp: '>=0.35.0'
