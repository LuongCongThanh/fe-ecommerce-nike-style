name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            perf
            style
            build
            revert
      - name: No AI, agent, or assistant references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -iE "claude|anthropic|codex|openai|chatgpt|copilot|gemini|cursor|windsurf|perplexity|deepseek|qwen|grok|llama|mistral|co-authored-by:.*(ai|bot|agent|assistant)" > /dev/null; then
            echo "PR title/body must not reference an AI tool, model, agent, assistant, or AI co-author. See CONTRIBUTING.md." >&2
            exit 1
          fi
